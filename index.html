<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8590c">
<title>Gudral General Store</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--or:#e8590c;--gr:#2b8a3e;--bg:#fff8f0;--tx:#2d2a26;--mu:#8a8178;--ln:#f3e3d1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:96px;max-width:720px;margin:auto}
button{font:inherit;cursor:pointer;border:none}
header{background:linear-gradient(135deg,#e8590c,#f59f00);color:#fff;padding:16px 16px 50px;border-radius:0 0 28px 28px;position:relative}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shop{font-size:25px;font-weight:800;line-height:1.1}
.sub{font-size:14px;opacity:.95}
.pill{background:#fff;color:var(--gr);padding:2px 10px;border-radius:20px;font-size:13px;font-weight:700;display:inline-block;margin-top:4px}
.pill.closed{color:#c92a2a}
.hbtn{background:#ffffff33;color:#fff;padding:8px 12px;border-radius:14px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;text-align:center}
.search{position:absolute;left:16px;right:16px;bottom:-26px}
.search input{width:100%;padding:15px 16px 15px 46px;border-radius:18px;border:2px solid #fff;font:inherit;font-size:17px;box-shadow:0 8px 20px #e8590c33;outline:none}
.search span{position:absolute;left:16px;top:13px;font-size:20px}
main{padding:40px 14px 10px}
h3{font-size:19px;margin:14px 2px 8px}
.offers{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.offer{min-width:230px;background:linear-gradient(135deg,#2b8a3e,#51cf66);color:#fff;border-radius:18px;padding:12px 14px}
.offer:nth-child(2n){background:linear-gradient(135deg,#862e9c,#cc5de8)}
.offer:nth-child(3n){background:linear-gradient(135deg,#1864ab,#4dabf7)}
.offer b{font-size:20px;display:block}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.cat{flex:0 0 auto;width:80px;text-align:center;background:#fff;border:2px solid var(--ln);border-radius:16px;padding:6px 4px;font-size:12px;line-height:1.15;font-weight:600}
.cat i{font-style:normal;font-size:28px;display:block}
.cat.on{border-color:var(--or);background:#fff1e6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border-radius:18px;padding:10px;position:relative;box-shadow:0 2px 8px #0000000d;display:flex;flex-direction:column}
.card.out{opacity:.55}
.disc{position:absolute;top:8px;left:8px;background:var(--gr);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;z-index:1}
.pic{height:96px;border-radius:14px;display:grid;place-items:center;font-size:52px;margin-bottom:6px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.nm{font-weight:700;font-size:15px;line-height:1.2}
.nh{font-size:14px;color:var(--mu);line-height:1.2}
.un{font-size:13px;color:var(--mu)}
.pr{margin:4px 0 8px;font-size:18px}.pr s{font-size:13px;color:var(--mu);margin-left:4px}
.add{margin-top:auto;background:var(--or);color:#fff;border-radius:12px;padding:8px;font-weight:700;font-size:16px;width:100%}
.add:disabled{background:#ced4da}
.step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:#fff1e6;border-radius:12px}
.step button{background:var(--or);color:#fff;width:38px;height:38px;border-radius:12px;font-size:22px;font-weight:800}
.step b{font-size:18px}
.empty{text-align:center;color:var(--mu);padding:30px;grid-column:1/-1}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:calc(100% - 24px);max-width:696px;background:var(--gr);color:#fff;border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px #2b8a3e66;font-size:17px;font-weight:700;cursor:pointer}
.hide{display:none!important}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.box{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px}
.x{background:#eee;color:#333;padding:6px 12px;border-radius:12px}
.ci{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px;margin-bottom:8px}
.ci .e{font-size:30px;width:44px;text-align:center}
.ci .t{flex:1;line-height:1.2}
.ci .step{width:110px;margin:0}
.sum{background:#fff;border-radius:14px;padding:10px 14px;margin:10px 0}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .tot{font-size:20px;font-weight:800;border-top:2px dashed var(--ln);margin-top:4px;padding-top:6px}
.nudge{background:#fff3bf;border-radius:12px;padding:8px 12px;font-size:15px;margin:6px 0}
label{display:block;font-weight:600;margin:8px 0 2px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ln);font:inherit;font-size:16px;background:#fff}
.big{display:block;width:100%;background:var(--or);color:#fff;border-radius:16px;padding:14px;font-size:19px;font-weight:800;margin-top:12px;text-align:center;text-decoration:none}
.big.g{background:var(--gr)}.big.l{background:#fff;color:var(--tx);border:2px solid var(--ln)}
.loc{padding:10px 12px;border-radius:12px;margin-top:6px;font-size:15px;background:#fff}
.loc.ok{background:#d3f9d8}.loc.bad{background:#ffe3e3}
.pay{display:flex;gap:8px}.pay label{flex:1;background:#fff;border:2px solid var(--ln);border-radius:12px;padding:10px;text-align:center;margin:0}
.pay input{display:none}.pay input:checked+span{color:var(--or);font-weight:800}
.ord{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px}
.st{font-size:17px;font-weight:700}
.prog{display:flex;gap:4px;margin:8px 0}.prog i{flex:1;height:6px;border-radius:4px;background:#e9ecef}.prog i.on{background:var(--gr)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2d2a26;color:#fff;padding:10px 18px;border-radius:14px;z-index:20;font-size:15px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="row">
    <div>
      <div class="shop" id="shopName">गुडराल जनरल स्टोर</div>
      <div class="sub">किराना से मनियारी तक – सब कुछ घर पर 🛵</div>
      <span class="pill" id="openPill">● खुला है</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <a class="hbtn" id="callBtn" href="#">📞 कॉल</a>
      <button class="hbtn" id="myOrdersBtn">📦 मेरे ऑर्डर</button>
    </div>
  </div>
  <div class="search"><span>🔍</span><input id="q" placeholder="साबुन, आटा, बिस्कुट... खोजें"></div>
</header>

<main>
  <div id="offerWrap" class="hide"><h3>🎁 आज के ऑफर</h3><div class="offers" id="offers"></div></div>
  <h3>🛍️ क्या चाहिए?</h3>
  <div class="cats" id="cats"></div>
  <h3 id="listTitle">सारा सामान</h3>
  <div class="grid" id="grid"><div class="empty">⏳ लोड हो रहा है...</div></div>
</main>

<div class="bar hide" id="bar"><span id="barInfo"></span><span>टोकरी देखें ➜</span></div>

<div class="sheet hide" id="cartSheet"><div class="box">
  <div class="row"><h3>🧺 आपकी टोकरी</h3><button class="x" data-close="cartSheet">✕</button></div>
  <div id="cartItems"></div>
  <div id="nudge"></div>
  <div class="sum" id="sum"></div>
  <h3>📍 डिलीवरी की जानकारी</h3>
  <label>नाम</label><input id="cName" placeholder="आपका नाम">
  <label>मोबाइल नंबर</label><input id="cPhone" type="tel" maxlength="10" placeholder="10 अंक का नंबर">
  <label>पता / निशानी</label><textarea id="cAddr" rows="2" placeholder="जैसे: मंदिर के पास, नीला गेट"></textarea>
  <button class="big l" id="locBtn">📍 मेरी लोकेशन लें</button>
  <div id="locMsg"></div>
  <label>भुगतान</label>
  <div class="pay">
    <label><input type="radio" name="pay" value="cash" checked><span>💵 नकद</span></label>
    <label><input type="radio" name="pay" value="upi"><span>📱 UPI</span></label>
  </div>
  <label>कुछ और कहना है? (वैकल्पिक)</label><input id="cNote" placeholder="जैसे: शाम 5 बजे के बाद लाना">
  <button class="big" id="placeBtn">✅ ऑर्डर करें</button>
</div></div>

<div class="sheet hide" id="ordSheet"><div class="box">
  <div class="row"><h3>📦 मेरे ऑर्डर</h3><button class="x" data-close="ordSheet">✕</button></div>
  <div id="ordList"></div>
</div></div>

<script type="module">
import { firebaseConfig, CATS, DEFAULT_SETTINGS } from './config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, addDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };
const ALL = [['all','🛒','All','सब कुछ','#fff'], ...CATS];
const catOf = id => CATS.find(c=>c[0]===id) || CATS[CATS.length-1];

let products=[], offers=[], S={...DEFAULT_SETTINGS}, loaded=false;
let cart=ls.get('cart',{}), cat='all', q='', myLoc=null;

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function distKm(a,b,c,d){const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))}

// Data (only 2 documents read per visit = very cheap)
onSnapshot(doc(db,'settings','shop'), s=>{ if(s.exists()) S={...DEFAULT_SETTINGS,...s.data()}; renderHeader(); renderCart(); });
onSnapshot(doc(db,'public','catalog'), s=>{
  const d=s.exists()?s.data():{}; products=d.items||[]; offers=d.offers||[]; loaded=true;
  renderOffers(); renderCart();
});

function renderHeader(){
  $('shopName').textContent=S.nameHi||S.name; document.title=S.name;
  $('openPill').textContent=S.open?`● खुला है · ${S.timing||''}`:'● अभी बंद है';
  $('openPill').className='pill'+(S.open?'':' closed');
  $('callBtn').href='tel:+'+S.phone;
}
function renderOffers(){
  $('offerWrap').classList.toggle('hide',!offers.length);
  $('offers').innerHTML=offers.map(o=>`<div class="offer"><b>${esc(o.title)}</b>${esc(o.desc)}${o.minOrder?`<div style="font-size:13px;opacity:.9">₹${o.minOrder} या ज़्यादा के ऑर्डर पर</div>`:''}</div>`).join('');
}
function renderCats(){ $('cats').innerHTML=ALL.map(c=>`<button class="cat ${c[0]===cat?'on':''}" data-cat="${c[0]}"><i>${c[1]}</i>${c[3]}</button>`).join(''); }
const stepper=(id,n)=>`<div class="step"><button data-dec="${id}">−</button><b>${n}</b><button data-inc="${id}">+</button></div>`;

function card(p){
  const c=catOf(p.cat), out=!(p.stock>0), n=cart[p.id]||0;
  const off=p.mrp>p.price?Math.round((p.mrp-p.price)*100/p.mrp):0;
  return `<div class="card ${out?'out':''}">
    ${off?`<span class="disc">${off}% छूट</span>`:''}
    <div class="pic" style="background:${c[4]}">${p.img?`<img src="${esc(p.img)}" loading="lazy" alt="">`:esc(p.emoji||c[1])}</div>
    <div class="nm">${esc(p.name)}</div>${p.nameHi?`<div class="nh">${esc(p.nameHi)}</div>`:''}
    <div class="un">${esc(p.unit)}</div>
    <div class="pr"><b>₹${p.price}</b>${p.mrp>p.price?`<s>₹${p.mrp}</s>`:''}</div>
    ${out?'<button class="add" disabled>खत्म हो गया</button>':n?stepper(p.id,n):`<button class="add" data-add="${p.id}">+ टोकरी में डालें</button>`}
  </div>`;
}
function renderGrid(){
  if(!loaded) return;
  const ql=q.trim().toLowerCase();
  const list=products.filter(p=>(cat==='all'||p.cat===cat)&&(!ql||(p.name+' '+p.nameHi+' '+p.tags).toLowerCase().includes(ql)))
    .sort((a,b)=>(b.stock>0)-(a.stock>0)||(b.featured-a.featured)||a.name.localeCompare(b.name));
  $('listTitle').textContent=ql?`"${q}" के नतीजे`:(cat==='all'?'सारा सामान':catOf(cat)[3]);
  $('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">😕 कुछ नहीं मिला<br>दुकान पर कॉल करके पूछें</div>';
}

function calc(){
  const items=Object.entries(cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return p&&p.stock>0?{p,qty:Math.min(qty,p.stock)}:null}).filter(Boolean);
  const sub=items.reduce((s,i)=>s+i.p.price*i.qty,0), mrpTot=items.reduce((s,i)=>s+(i.p.mrp||i.p.price)*i.qty,0);
  let best=null,disc=0,next=null;
  for(const o of offers){
    const v=o.type==='percent'?Math.round(sub*o.value/100):Number(o.value), d=Math.min(v,o.maxOff||Infinity,sub);
    if(sub>=(o.minOrder||0)){ if(d>disc){disc=d;best=o} } else if(!next||o.minOrder<next.minOrder) next=o;
  }
  const after=sub-disc, del=!items.length?0:(S.freeAbove>0&&after>=S.freeAbove?0:Number(S.deliveryCharge||0));
  return {items,sub,mrpTot,best,disc,next,del,total:after+del};
}
function renderCart(){
  ls.set('cart',cart);
  const c=calc(), n=c.items.reduce((s,i)=>s+i.qty,0);
  $('bar').classList.toggle('hide',!n);
  $('barInfo').textContent=`🧺 ${n} सामान · ₹${c.total}`;
  $('cartItems').innerHTML=c.items.length?c.items.map(({p,qty})=>`<div class="ci"><div class="e">${esc(p.emoji||catOf(p.cat)[1])}</div><div class="t"><b>${esc(p.name)}</b><br><small>${esc(p.unit)} · ₹${p.price}</small></div>${stepper(p.id,qty)}</div>`).join(''):'<div class="empty">टोकरी खाली है</div>';
  let nd='';
  if(c.items.length&&c.next) nd+=`<div class="nudge">💡 ₹${c.next.minOrder-c.sub} का और सामान लें — <b>${esc(c.next.title)}</b> पाएं!</div>`;
  if(c.items.length&&c.del&&S.freeAbove>0) nd+=`<div class="nudge">🛵 ₹${S.freeAbove-(c.sub-c.disc)} और लें — डिलीवरी <b>मुफ़्त</b>!</div>`;
  $('nudge').innerHTML=nd;
  const saved=c.mrpTot-c.sub+c.disc;
  $('sum').innerHTML=`<div><span>सामान का दाम</span><span>₹${c.sub}</span></div>
    ${c.disc?`<div style="color:var(--gr)"><span>🎁 ${esc(c.best.title)}</span><span>−₹${c.disc}</span></div>`:''}
    <div><span>डिलीवरी</span><span>${c.del?'₹'+c.del:'<b style="color:var(--gr)">मुफ़्त</b>'}</span></div>
    <div class="tot"><span>कुल</span><span>₹${c.total}</span></div>
    ${saved>0?`<div style="color:var(--gr);font-weight:700">🎉 आपने ₹${saved} बचाए!</div>`:''}`;
  renderGrid();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-add],[data-inc],[data-dec],[data-cat],[data-close],[data-re]'); if(!t) return;
  const d=t.dataset;
  if(d.cat){cat=d.cat;renderCats();renderGrid();return}
  if(d.close){$(d.close).classList.add('hide');return}
  if(d.re){const o=ordData[d.re]; if(o) o.items.forEach(i=>{const p=products.find(x=>x.id===i.id); if(p&&p.stock>0) cart[i.id]=Math.min(i.qty,p.stock)});
    renderCart(); $('ordSheet').classList.add('hide'); $('cartSheet').classList.remove('hide'); return}
  const id=d.add||d.inc||d.dec, p=products.find(x=>x.id===id); if(!p) return;
  if(d.dec){cart[id]=(cart[id]||0)-1; if(cart[id]<=0) delete cart[id]}
  else{ if((cart[id]||0)>=p.stock) return toast('बस इतना ही स्टॉक है'); cart[id]=(cart[id]||0)+1 }
  renderCart();
});
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.add('hide')}));
$('q').oninput=e=>{q=e.target.value;renderGrid()};
$('bar').onclick=()=>$('cartSheet').classList.remove('hide');
$('myOrdersBtn').onclick=()=>showOrders();

const me=ls.get('me',null); if(me){$('cName').value=me.name;$('cPhone').value=me.phone;$('cAddr').value=me.addr}

$('locBtn').onclick=()=>{
  if(!navigator.geolocation) return toast('लोकेशन नहीं मिल रही');
  $('locMsg').innerHTML='<div class="loc">⏳ लोकेशन ढूंढ रहे हैं...</div>';
  navigator.geolocation.getCurrentPosition(pos=>{
    const la=pos.coords.latitude, lo=pos.coords.longitude, dk=distKm(S.lat,S.lng,la,lo);
    myLoc={lat:la,lng:lo,d:Math.round(dk*100)/100};
    const ok=dk<=S.radiusKm;
    $('locMsg').innerHTML=`<div class="loc ${ok?'ok':'bad'}">${ok?`✅ आप दुकान से ${myLoc.d} km दूर हैं — डिलीवरी हो जाएगी!`:`😔 आप ${myLoc.d} km दूर हैं। हम सिर्फ़ ${S.radiusKm} km तक डिलीवरी करते हैं। कृपया दुकान पर आकर ले जाएं या कॉल करें।`}</div>`;
  },()=>{$('locMsg').innerHTML='<div class="loc bad">❌ लोकेशन नहीं मिली। फ़ोन में GPS / Location चालू करें और दोबारा दबाएं।</div>'},
  {enableHighAccuracy:true,timeout:20000,maximumAge:60000});
};

$('placeBtn').onclick=async()=>{
  const c=calc(), name=$('cName').value.trim(), phone=$('cPhone').value.replace(/\D/g,''), addr=$('cAddr').value.trim();
  if(!S.open) return toast('दुकान अभी बंद है 🙏');
  if(!c.items.length) return toast('टोकरी खाली है');
  if(c.sub<S.minOrder) return toast(`कम से कम ₹${S.minOrder} का ऑर्डर करें`);
  if(!name||phone.length!==10||!addr) return toast('नाम, 10 अंक का नंबर और पता भरें');
  if(!myLoc) return toast('📍 पहले "मेरी लोकेशन लें" दबाएं');
  if(myLoc.d>S.radiusKm) return toast(`माफ़ करें, ${S.radiusKm} km से बाहर डिलीवरी नहीं`);
  ls.set('me',{name,phone,addr});
  const btn=$('placeBtn'); btn.disabled=true; btn.textContent='⏳ भेज रहे हैं...';
  try{
    const order={name,phone,address:addr,note:$('cNote').value.trim(),lat:myLoc.lat,lng:myLoc.lng,distanceKm:myLoc.d,
      items:c.items.map(({p,qty})=>({id:p.id,name:p.name,unit:p.unit||'',price:p.price,qty})),
      subtotal:c.sub,discount:c.disc,offer:c.best?c.best.title:'',delivery:c.del,total:c.total,
      payment:document.querySelector('input[name=pay]:checked').value,status:'new',ts:Date.now()};
    const ref=await addDoc(collection(db,'orders'),order);
    const mine=ls.get('myOrders',[]); mine.unshift(ref.id); ls.set('myOrders',mine.slice(0,20));
    cart={}; renderCart(); $('cartSheet').classList.add('hide');
    const msg=`नमस्ते! मैंने ऑर्डर किया है 🛒\nऑर्डर #${ref.id.slice(-5).toUpperCase()}\n${name}, ${addr}\n`+order.items.map(i=>`• ${i.name} × ${i.qty}`).join('\n')+`\nकुल: ₹${order.total}`;
    showOrders(`<div class="ord" style="background:#d3f9d8;text-align:center"><div style="font-size:44px">🎉</div><b style="font-size:20px">ऑर्डर हो गया!</b><br>दुकानदार जल्दी पुष्टि करेंगे।<a class="big g" href="https://wa.me/${S.phone}?text=${encodeURIComponent(msg)}" target="_blank">💬 WhatsApp पर भी बताएं</a></div>`);
  }catch(err){console.error(err);toast('ऑर्डर नहीं गया, दोबारा कोशिश करें')}
  btn.disabled=false; btn.textContent='✅ ऑर्डर करें';
};

const STEPS=[['new','📝 ऑर्डर मिल गया'],['accepted','📦 सामान तैयार हो रहा है'],['out','🛵 रास्ते में है'],['delivered','🎉 पहुँच गया']];
let unsubs=[], ordData={};
function showOrders(banner=''){
  unsubs.forEach(u=>u()); unsubs=[]; ordData={};
  const ids=ls.get('myOrders',[]);
  const draw=()=>{$('ordList').innerHTML=banner+(ids.length?ids.map(id=>{
    const o=ordData[id]; if(!o) return ''; const si=STEPS.findIndex(s=>s[0]===o.status);
    return `<div class="ord"><div class="row"><b>#${id.slice(-5).toUpperCase()}</b><small>${new Date(o.ts).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})}</small></div>
      <div class="st">${o.status==='cancelled'?'❌ रद्द हो गया':(STEPS[si]?.[1]||'')}</div>
      ${o.status!=='cancelled'?`<div class="prog">${STEPS.map((s,i)=>`<i class="${i<=si?'on':''}"></i>`).join('')}</div>`:''}
      <small>${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</small><div><b>₹${o.total}</b></div>
      <button class="add" style="margin-top:8px" data-re="${id}">🔁 यही फिर से मंगाएं</button></div>`}).join(''):'<div class="empty">अभी कोई ऑर्डर नहीं</div>')};
  ids.forEach(id=>unsubs.push(onSnapshot(doc(db,'orders',id),s=>{if(s.exists())ordData[id]=s.data();draw()},()=>{})));
  draw(); $('ordSheet').classList.remove('hide');
}

renderCats(); renderHeader();
</script>
</body>
</html>
